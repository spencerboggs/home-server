<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Server</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #14120e;
        color: #f4ecdc;
        font-family: "Segoe UI", sans-serif;
      }
      main { max-width: 28rem; padding: 2rem; }
      h1 { font-family: Palatino, "Palatino Linotype", serif; font-size: 4rem; line-height: 0.95; margin: 0.2rem 0 0; }
      p { color: #b5a890; }
      a, button {
        display: inline-block;
        margin-top: 1.5rem;
        background: #e2ac4a;
        color: #14120e;
        text-decoration: none;
        border: 0;
        border-radius: 999px;
        padding: 0.6rem 1.1rem;
        font: inherit;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <p>Private cloud</p>
      <h1>The Server</h1>
      <p id="state">Checking the server.</p>
      <a id="enter" class="hidden" href="#">Enter</a>
      <p id="down" class="hidden">The server is offline or in maintenance. Try again later.</p>
    </main>
    <script src="config.js"></script>
    <script>
      const state = document.getElementById("state");
      const enter = document.getElementById("enter");
      const down = document.getElementById("down");
      const config = window.THE_SERVER || {};
      enter.href = config.enterUrl || "#";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000);
      fetch(config.healthUrl, { signal: controller.signal, cache: "no-store" })
        .then((response) => response.json())
        .then((body) => {
          if (body && body.status === "online") {
            state.textContent = "The server is online.";
            enter.classList.remove("hidden");
            return;
          }
          throw new Error("offline");
        })
        .catch(() => {
          state.textContent = "The server is not responding.";
          down.classList.remove("hidden");
        })
        .finally(() => clearTimeout(timer));
    </script>
  </body>
</html>
