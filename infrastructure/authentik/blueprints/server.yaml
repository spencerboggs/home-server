# Loaded by Authentik from /blueprints/custom on startup.
# Enrollment requires an invitation. The dashboard creates those invitations
# and records which administrator issued each one.
version: 1
metadata:
  name: the-server
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    identifiers:
      name: administrators
    attrs:
      is_superuser: true

  - model: authentik_core.group
    identifiers:
      name: users
    attrs:
      is_superuser: false

  - model: authentik_stages_invitation.invitationstage
    id: referral-stage
    identifiers:
      name: server-referral
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-enrollment-flow]]
      stage: !Find [authentik_stages_invitation.invitationstage, [name, server-referral]]
      order: 0
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_providers_oauth2.oauth2provider
    id: dashboard-oauth
    identifiers:
      name: Dashboard
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: dashboard
      client_secret: !Env DASHBOARD_OIDC_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Env DASHBOARD_REDIRECT_URI
      sub_mode: user_username
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-groups]]

  - model: authentik_core.application
    identifiers:
      slug: dashboard
    attrs:
      name: Dashboard
      slug: dashboard
      provider: !KeyOf dashboard-oauth
      meta_launch_url: !Env DASHBOARD_URL
      policy_engine_mode: any

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-oauth
    identifiers:
      name: Grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Env GRAFANA_REDIRECT_URI
      sub_mode: user_username
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-groups]]

  - model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      slug: grafana
      provider: !KeyOf grafana-oauth
      meta_launch_url: !Env GRAFANA_URL
      policy_engine_mode: any

  - model: authentik_providers_oauth2.oauth2provider
    id: forgejo-oauth
    identifiers:
