global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["server-prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["server-node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["server-cadvisor:8080"]

  - job_name: gpu
    static_configs:
      - targets: ["server-gpu-exporter:9835"]
