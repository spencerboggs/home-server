groups:
  - name: server
    rules:
      - alert: DiskAbove85
        expr: (1 - node_filesystem_avail_bytes{mountpoint=~"/|/srv/bulk",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint=~"/|/srv/bulk",fstype!~"tmpfs|overlay"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is over 85% full"

      - alert: DiskAbove95
        expr: (1 - node_filesystem_avail_bytes{mountpoint=~"/|/srv/bulk",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint=~"/|/srv/bulk",fstype!~"tmpfs|overlay"}) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is over 95% full"

      - alert: MemorySustainedHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: RAM has stayed above 90%

      - alert: ContainerRestarting
        expr: increase(container_start_time_seconds[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container restarts are climbing"
